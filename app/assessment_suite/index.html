<script>
  /* Appearance: Light (default), Dark or Match system, saved on this computer.
     Applied here, before the page draws, so a dark session never flashes light.
     A floating button (bottom left) switches light/dark on every screen, and the
     first sign-in on a computer offers the choice (Online.route calls offerChoice).
     Picture-based tests stay light whatever is set (see DARK THEME in styles.css).
     An open Client view window follows the same setting. */
  window.NMTheme = (function(){
    var KEY = 'nm-theme', mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>';
    var fab = null, ask = null;
    function get(){ try{ var t = localStorage.getItem(KEY); return (t==='dark'||t==='system') ? t : 'light'; }catch(e){ return 'light'; } }
    function chosen(){ try{ return localStorage.getItem(KEY) !== null; }catch(e){ return true; } }
    function isDark(){ var t = get(); return t==='dark' || (t==='system' && !!mq && mq.matches); }
    function apply(){
      var dark = isDark();
      [document, clientDoc()].forEach(function(d){
        if(!d) return;
        if(dark) d.documentElement.setAttribute('data-theme','dark');
        else d.documentElement.removeAttribute('data-theme');
      });
      if(fab){ var l = dark ? 'Switch to light mode' : 'Switch to dark mode'; fab.innerHTML = dark ? SUN : MOON; fab.title = l; fab.setAttribute('aria-label', l); }
      // keep any open Appearance menu in step
      var cur = get();
      Array.prototype.forEach.call(document.querySelectorAll('[data-theme-opt]'), function(el){ el.setAttribute('aria-pressed', String(el.getAttribute('data-theme-opt')===cur)); });
    }
    function clientDoc(){ try{ var w = (typeof App !== 'undefined') && App._cw; return (w && !w.closed) ? w.document : null; }catch(e){ return null; } }
    function set(t){ try{ localStorage.setItem(KEY, t); }catch(e){} apply(); }
    function toggle(){ set(isDark() ? 'light' : 'dark'); }
    function mountFab(){
      if(fab || !document.body) return;
      fab = document.createElement('button');
      fab.type = 'button'; fab.className = 'nm-theme-fab no-print'; fab.onclick = toggle;
      document.body.appendChild(fab); apply();
    }
    /* first sign-in on this computer: a small card above the button, not a pop-up.
       Light / Dark apply (and save) straight away and the card stays, so people can
       flip back and forth; it closes on a click anywhere else, or Escape. */
    function offerChoice(){
      if(chosen() || ask || !document.body) return;
      mountFab();
      ask = document.createElement('div');
      ask.className = 'nm-theme-ask no-print'; ask.setAttribute('role','dialog'); ask.setAttribute('aria-label','Light or dark');
      ask.innerHTML = '<p class="nm-theme-ask-h">Light or dark?</p><p class="nm-theme-ask-p">Try each to see which you prefer. You can switch at any time with the button below.</p>'
        + '<div class="nm-theme-ask-row"><button type="button" data-theme-opt="light">' + SUN + 'Light</button><button type="button" data-theme-opt="dark">' + MOON + 'Dark</button></div>';
      ask.addEventListener('click', function(e){ var b = e.target.closest('[data-theme-opt]'); if(b) set(b.getAttribute('data-theme-opt')); });
      document.body.appendChild(ask);
      document.addEventListener('pointerdown', onAway, true);
      document.addEventListener('keydown', onKey, true);
      apply();
    }
    function onAway(e){ if(ask && !ask.contains(e.target) && !(fab && fab.contains(e.target))) closeAsk(); }
    function onKey(e){ if(e.key === 'Escape') closeAsk(); }
    function closeAsk(){
      if(!ask) return;
      ask.parentNode && ask.parentNode.removeChild(ask); ask = null;
      document.removeEventListener('pointerdown', onAway, true);
      document.removeEventListener('keydown', onKey, true);
    }
    if(mq){ if(mq.addEventListener) mq.addEventListener('change', apply); else if(mq.addListener) mq.addListener(apply); }
    apply();
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mountFab); else mountFab();
    return { get:get, set:set, apply:apply, toggle:toggle, chosen:chosen, offerChoice:offerChoice };
  })();
</script>

<body>
<!-- Branded boot splash: the leaf flies in (from where the site nav logo sat),
     holds, spins, then dissolves to reveal the app. Shows once per browser
     session; skipped entirely for prefers-reduced-motion. -->
<div id="nm-boot" aria-hidden="true">
  <div class="nm-boot-fly"><div class="nm-boot-spin">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#1E3B2F"/><path d="M16 25c0-6 3-10 9-11-1 6-4 10-9 11Z" fill="#F7F2E8"/><path d="M16 25c0-5-2-8-7-9 .8 5 3 8 7 9Z" fill="#A9BBA6"/><circle cx="16" cy="9" r="2.6" fill="#D2BD92"/></svg>
  </div></div>
</div>
<script>
  (function(){
    var boot = document.getElementById('nm-boot');
    if(!boot) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try{
      if(reduce || sessionStorage.getItem('nm-booted')){ boot.remove(); return; }
      sessionStorage.setItem('nm-booted','1');
    }catch(e){ /* private mode: just play it */ }
    setTimeout(function(){ if(boot && boot.parentNode) boot.parentNode.removeChild(boot); }, 1850);
  })();
</script>

<script>
  /* Boot — online mode hands off to the Supabase auth flow; local mode is the
     clinician tool exactly as before (and what the offline single-file ships with). */
  document.addEventListener('DOMContentLoaded', () => {
    if(typeof CONFIG !== 'undefined' && CONFIG.resolvedMode === 'online'){
      // Online: don't flash the local instrument grid — show a neutral splash
      // until Online.init() renders the sign-in screen or the clinician console.
      document.body.classList.add('pt-shell');   // the sign-in door is in the patient (Blend) look; the console turns it off
      document.title = CONFIG.clinicName; document.querySelector('.brand-text b').textContent = CONFIG.clinicName;
      document.getElementById('view-home').innerHTML =
        '<div class="cc-loading" role="status" aria-live="polite"><span class="cc-loading-logo"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#1E3B2F"/><path d="M16 25c0-6 3-10 9-11-1 6-4 10-9 11Z" fill="#F7F2E8"/><path d="M16 25c0-5-2-8-7-9 .8 5 3 8 7 9Z" fill="#A9BBA6"/><circle cx="16" cy="9" r="2.6" fill="#D2BD92"/></svg></span><span class="cc-loading-label">Loading…</span></div>';
      Online.init();
    } else {
      // Local / offline (incl. the hosted supplement tools): a ?tool=<id> deep link
      // opens that instrument directly so a specific tool can be bookmarked/shared.
      // Capture it before go('home') clears the param; openTest() validates the id.
      var deepTool = null;
      try{ deepTool = new URLSearchParams(window.location.search).get('tool'); }catch(e){}
      App.renderHome();
      App.go('home');
      if(deepTool) App.openTest(deepTool);
    }
  });
</script>
